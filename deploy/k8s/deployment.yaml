apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-app-with-claude-sidecar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example-app
  template:
    metadata:
      labels:
        app: example-app
    spec:
      # ≥ app shutdown + SHUTDOWN_GRACE_SEC + 15s: the native sidecar is SIGTERMed only
      # after the app exits; then stream grace, uvicorn, and up to 12s for turns still
      # closing their CLI (see docs/operations.md#shutdown).
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 10001        # the image's non-root user owns the state volume
      initContainers:
        # ── Codex auth Option B (PROVIDER=codex, OAuth): copy auth.json into the
        # writable CODEX_HOME (/var/lib/claude-sidecar/codex on the state volume).
        # codex writes session files and refreshed tokens there, so the Secret must
        # not be mounted over the directory (read-only).
        # - name: codex-home-init
        #   image: busybox:1.36
        #   securityContext: { runAsUser: 10001, runAsGroup: 10001 }
        #   command: ["sh", "-c", "mkdir -p /state/codex && cp /secret/auth.json /state/codex/auth.json && chmod 600 /state/codex/auth.json"]
        #   volumeMounts:
        #     - { name: codex-oauth, mountPath: /secret, readOnly: true }
        #     - { name: state,       mountPath: /state }
        #
        # k8s 1.28+ native sidecar via restartPolicy=Always on an initContainer.
        #
        # ── PROVIDER=claude (default) ─────────────────────────────────────────
        # Uses ANTHROPIC_API_KEY from the anthropic-claude-auth Secret.
        # Switch to PROVIDER=codex by replacing the auth env/volume below;
        # see the commented codex blocks at the bottom of this file.
        - name: claude-sidecar
          image: ghcr.io/REPLACE_ORG/claude-sidecar:1.0.0
          restartPolicy: Always
          # Not verified on a cluster yet: if a CLI needs to write somewhere else,
          # add an emptyDir there rather than dropping readOnlyRootFilesystem.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          ports:
            # Informational only: the sidecar listens on 127.0.0.1, reachable from
            # the app container over the shared loopback, not on the Pod IP.
            - containerPort: 7300
          env:
            - name: PROVIDER
              value: "claude"          # switch to "codex" for the Codex backend
            - name: BEARER_SECRET
              valueFrom:
                secretKeyRef:
                  name: sidecar-secret
                  key: bearer
            # ── Claude auth ──────────────────────────────────────────────────
            # Production / general use: API key only. The subscription OAuth
            # token (CLAUDE_CODE_OAUTH_TOKEN) is for LOCAL TESTING ONLY and
            # must never be deployed to a cluster.
            - name: ANTHROPIC_MODE
              value: "api"           # makes /readyz require the API key
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-claude-auth
                  key: ANTHROPIC_API_KEY
            # ── Codex auth Option A: API key (uncomment when PROVIDER=codex) ─
            # - name: OPENAI_API_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: openai-codex-auth
            #       key: OPENAI_API_KEY
            - name: MAX_CONCURRENT
              value: "8"
            - name: TURN_TIMEOUT_SEC
              value: "90"
            - name: BIND
              value: "127.0.0.1"
          volumeMounts:
            - { name: mcp-config,  mountPath: /etc/sidecar,     readOnly: true }
            - { name: claude-md,   mountPath: /workspace,       readOnly: true }
            # All mutable state: session workspaces, claude transcripts/config
            # (CLAUDE_CONFIG_DIR) and codex auth/rollouts (CODEX_HOME). Use a
            # persistent volume instead to keep conversations across Pod restarts.
            - { name: state,       mountPath: /var/lib/claude-sidecar }
            - { name: tmp,         mountPath: /tmp }           # per-turn MCP config / system-prompt files
            - { name: home,        mountPath: /home/sidecar }  # CLI caches
          # exec probes, not httpGet: kubelet sends httpGet to the Pod IP, which a
          # BIND=127.0.0.1 server never answers. The app container still reaches the
          # sidecar over the shared loopback; nothing else in the cluster can.
          # The opener raises on non-2xx (a 503 from /readyz fails the probe) and ignores
          # HTTP(S)_PROXY, which would otherwise capture 127.0.0.1.
          # Native sidecar: the app container starts only after this succeeds.
          startupProbe:
            exec:
              command: ["python", "-c", "import urllib.request as u; u.build_opener(u.ProxyHandler({})).open('http://127.0.0.1:7300/healthz', timeout=2)"]
            periodSeconds: 1
            failureThreshold: 30
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command: ["python", "-c", "import urllib.request as u; u.build_opener(u.ProxyHandler({})).open('http://127.0.0.1:7300/readyz', timeout=2)"]
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["python", "-c", "import urllib.request as u; u.build_opener(u.ProxyHandler({})).open('http://127.0.0.1:7300/healthz', timeout=2)"]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
      containers:
        - name: app
          image: ghcr.io/REPLACE_ORG/example-app:latest
          # The app talks to the sidecar over localhost:7300.
          env:
            - name: SIDECAR_URL
              value: "http://127.0.0.1:7300"
      volumes:
        - name: mcp-config
          configMap:
            name: app-mcp-config
        - name: claude-md
          configMap:
            name: app-claude-md
        - name: state
          emptyDir:
            sizeLimit: 10Gi   # transcripts and rollouts grow; size for your retention
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
        # ── Codex Option B only (uncomment when PROVIDER=codex) ─
        # - name: codex-oauth
        #   secret:
        #     secretName: openai-codex-oauth
        #     items:
        #       - key: auth.json
        #         path: auth.json
