# Dependabot reads this from the default branch only: nothing happens until it is merged.
# Every update PR is checked by .github/workflows/ci.yml.
version: 2
updates:
  # constraints.txt (the image's runtime lock) is read as a requirements file: its lines
  # are plain `name==version` pins. One weekly PR for the lock; claude-agent-sdk gets its
  # own, since the runners depend on its bundled CLI's flags and events (AGENTS.md).
  # If a grouped PR breaks a pinned pair (e.g. pydantic / pydantic_core), regenerate the
  # lock as its header describes instead of editing pins by hand.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
        exclude-patterns: ["claude-agent-sdk"]

  # The base image (python:<minor>-slim-bookworm). A Python minor bump also moves CI to
  # that Python (the workflow reads it from the Dockerfile); regenerate constraints.txt
  # on it. Node (NODE_MAJOR) and codex (CODEX_VERSION) are Dockerfile ARGs, which
  # Dependabot does not update: bump those by hand.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
